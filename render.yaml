# Creates paid cloud resources only when deployed from your Render account.
services:
  - type: web
    name: housing-evidence-demo
    runtime: node
    plan: 0.5c-512mb
    region: ohio
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: housing-evidence-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: MONITOR_ADMIN_TOKEN
        generateValue: true
      - key: MONITOR_REFRESH_PERMITS
        value: "true"
databases:
  - name: housing-evidence-db
    plan: 0.1c-256mb
    region: ohio
    diskSizeGB: 1
    ipAllowList: []
